<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="login.css">

</head>

<body>

<div id="pageLoader" class="page-loader page-loader-hidden" aria-label="Carregando">
	<img src="logopng.png" alt="LDA" class="loader-logo">
	<div class="loader-spinner" aria-hidden="true"></div>
	<p>Carregando...</p>
</div>

    
    
<div class="login-container">

<!-- LADO ESQUERDO -->
<div class="login-left">



<p>
Sistema oficial do ranking LDA
</p>

</div>


<!-- LADO DIREITO -->
<div class="login-right">

<img src="logopng.png" class="login-logo">

<div class="login-box">

<h2> Acesso LDA</h2>

<input 
type="email" 
id="emailInput"
placeholder="Digite seu e-mail"
>

<div class="senha-wrapper">
	<input 
	type="password" 
	id="senhaInput"
	placeholder="Digite a senha"
	>
	<button type="button" id="toggleSenha" class="toggle-senha" aria-label="Mostrar senha" title="Mostrar senha">
		<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
			<path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
			<circle cx="12" cy="12" r="2.7"></circle>
		</svg>
	</button>
</div>

<button id="btnLogin">
Entrar
</button>

<button type="button" id="btnResetSenha" class="reset-senha">
	Esqueci minha senha
</button>

<p id="erroLogin" class="erro-login"></p>

</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, sendPasswordResetEmail, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
	apiKey: "AIzaSyBq2SSpFMNoH1s3bvck6dSdjBm4EyUUJ-8",
	authDomain: "ranking-lda.firebaseapp.com",
	projectId: "ranking-lda",
	storageBucket: "ranking-lda.firebasestorage.app",
	messagingSenderId: "907822809490",
	appId: "1:907822809490:web:1b936d300e7b196eb2014b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const emailInput = document.getElementById("emailInput");
const senhaInput = document.getElementById("senhaInput");
const btnLogin = document.getElementById("btnLogin");
const btnResetSenha = document.getElementById("btnResetSenha");
const erroLogin = document.getElementById("erroLogin");
const toggleSenha = document.getElementById("toggleSenha");
const pageLoader = document.getElementById("pageLoader");

toggleSenha.onclick = () => {
	const senhaVisivel = senhaInput.type === "text";
	senhaInput.type = senhaVisivel ? "password" : "text";
	toggleSenha.classList.toggle("senha-visivel", !senhaVisivel);
	toggleSenha.setAttribute("aria-label", senhaVisivel ? "Mostrar senha" : "Ocultar senha");
	toggleSenha.title = senhaVisivel ? "Mostrar senha" : "Ocultar senha";
};

btnLogin.onclick = async () => {
	erroLogin.textContent = "";
	erroLogin.classList.remove("sucesso-login");
	pageLoader.classList.remove("page-loader-hidden");
	const inicioLogin = Date.now();

	try {
		await signInWithEmailAndPassword(auth, emailInput.value.trim(), senhaInput.value);
		localStorage.setItem("Ligalda", "true");
		const tempoRestante = Math.max(0, 1500 - (Date.now() - inicioLogin));
		setTimeout(() => {
			window.location.href = "index.html";
		}, tempoRestante);
	} catch (error) {
		pageLoader.classList.add("page-loader-hidden");
		erroLogin.textContent = "E-mail ou senha incorretos!";
	}

};

btnResetSenha.onclick = async () => {
	erroLogin.textContent = "";
	erroLogin.classList.remove("sucesso-login");
	const email = emailInput.value.trim();

	if (!email) {
		erroLogin.textContent = "Digite seu e-mail para redefinir a senha.";
		return;
	}

	try {
		await sendPasswordResetEmail(auth, email);
		erroLogin.classList.add("sucesso-login");
		erroLogin.textContent = "Se o e-mail estiver cadastrado, você receberá o link de redefinição.";
	} catch (error) {
		erroLogin.classList.remove("sucesso-login");
		erroLogin.textContent = "Não foi possível enviar o link. Verifique o e-mail e tente novamente.";
	}
};

</script>

</body>
</html>
