<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="login-container">

<!-- LADO ESQUERDO -->
<div class="login-left">

<h1> LDA</h1>

<p>
Sistema oficial do ranking LDA
</p>

</div>


<!-- LADO DIREITO -->
<div class="login-right">

<img src="logopng.png" class="login-logo">

<div class="login-box">

<h2> Acesso LDA</h2>

<input 
type="email" 
id="emailInput"
placeholder="Digite seu e-mail"
>

<input 
type="password" 
id="senhaInput"
placeholder="Digite a senha"
>

<button id="btnLogin">
Entrar
</button>

<p id="erroLogin" class="erro-login"></p>

</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
	apiKey: "AIzaSyBq2SSpFMNoH1s3bvck6dSdjBm4EyUUJ-8",
	authDomain: "ranking-lda.firebaseapp.com",
	projectId: "ranking-lda",
	storageBucket: "ranking-lda.firebasestorage.app",
	messagingSenderId: "907822809490",
	appId: "1:907822809490:web:1b936d300e7b196eb2014b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const emailInput = document.getElementById("emailInput");
const senhaInput = document.getElementById("senhaInput");
const btnLogin = document.getElementById("btnLogin");
const erroLogin = document.getElementById("erroLogin");

btnLogin.onclick = async () => {
	erroLogin.textContent = "";

	try {
		await signInWithEmailAndPassword(auth, emailInput.value.trim(), senhaInput.value);
		localStorage.setItem("Ligalda", "true");
		window.location.href = "index.html";
	} catch (error) {
		erroLogin.textContent = "E-mail ou senha incorretos!";
	}

};

</script>

</body>
</html>
